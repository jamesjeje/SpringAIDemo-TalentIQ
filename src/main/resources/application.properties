spring.application.name=Spring_AI_Demo

spring.ai.google.genai.api-key=${GEMINI_API_KEY:replace-with-your-gemini-key}
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite
spring.ai.google.genai.chat.temperature=0.7
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:replace-with-your-gemini-key}
spring.ai.google.genai.embedding.model=gemini-embedding-2
debug=true
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
#spring.ai.google.genai.embedding.text.model=gemini-embedding-2
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@example.com}
spring.mail.password=${MAIL_PASSWORD:replace-with-app-password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.ai.mcp.server.name=email-server
spring.ai.mcp.server.version=1.0.0